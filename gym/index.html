<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#121417">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Workout Tracker</title>
  
  <!-- Typography: Manrope + Source Sans 3 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
  
  <!-- Early Theme Boot Script to prevent flashing -->
  <script>
    (function() {
      try {
        var pref = localStorage.getItem('my_gym_theme_preference') || 'system';
        var isDark = pref === 'dark' || (pref === 'system' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme-preference', pref);
      } catch (e) {}
    })();
  </script>

  <style>
/* Design System Baseline: Neutral Off-white, Graphite, Restrained Blue Accents */

:root, [data-theme="light"] {
  --bg-canvas: #F7F8FA;
  --bg-surface: #FFFFFF;
  --bg-surface-raised: #EDF0F4;
  --bg-surface-selected: #EAF0FF;
  --text-primary: #20242B;
  --text-secondary: #596273;
  --border-subtle: #DCE1E8;
  --border-control: #7D8796;
  --primary: #315DCE;
  --primary-hover: #284FB5;
  --primary-pressed: #204299;
  --on-primary: #FFFFFF;
  --focus: #315DCE;
  --success: #26704B;
  --warning: #865C00;
  --error: #B52D41;
  --info: #405D89;
  --surface-container-high: #EDF0F4;
  --on-surface-variant: #596273;
  --shadow-overlay: 0 12px 32px rgba(18, 20, 23, 0.12);
  --scrim: rgba(18, 20, 23, 0.4);
}

[data-theme="dark"] {
  --bg-canvas: #121417;
  --bg-surface: #1B1E23;
  --bg-surface-raised: #252A31;
  --bg-surface-selected: #202F4A;
  --text-primary: #F3F5F7;
  --text-secondary: #B2BBC8;
  --surface-container-high: #252A31;
  --on-surface-variant: #B2BBC8;
  --border-subtle: #373E49;
  --border-control: #7C8797;
  --primary: #91B2FF;
  --primary-hover: #AAC3FF;
  --primary-pressed: #799DF2;
  --on-primary: #101B33;
  --focus: #91B2FF;
  --success: #85D6AA;
  --warning: #E9C46E;
  --error: #FFA5B2;
  --info: #ACBDD8;
  --shadow-overlay: 0 12px 32px rgba(0, 0, 0, 0.32);
  --scrim: rgba(0, 0, 0, 0.6);
}

:root {
  --font-display: 'Manrope', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  --font-body: 'Source Sans 3', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  --radius-btn: 12px;
  --radius-card: 16px;
  --radius-sheet: 24px;
  --radius-pill: 9999px;
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 20px;
  --space-6: 24px;
  --space-8: 32px;
  --space-12: 48px;
  --space-16: 64px;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
}

body {
  font-family: var(--font-body);
  background-color: var(--bg-canvas);
  color: var(--text-primary);
  min-height: 100vh;
  padding-bottom: 96px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

h1, h2, h3, h4, .font-display {
  font-family: var(--font-display);
}

.tabular-nums {
  font-variant-numeric: tabular-nums;
}

/* Header */
header.app-header {
  background: var(--bg-surface);
  border-bottom: 1px solid var(--border-subtle);
  padding: 12px 16px;
  position: sticky;
  top: 0;
  z-index: 50;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.app-brand {
  font-family: var(--font-display);
  font-size: 1.25rem;
  font-weight: 700;
  color: var(--text-primary);
  display: flex;
  align-items: center;
  gap: 8px;
  text-decoration: none;
}

.header-actions {
  display: flex;
  align-items: center;
  gap: 8px;
}

/* A quiet, persistent explanation of where the current data came from. */
.header-identity { min-width: 0; }
.connection-status {
  display: flex;
  align-items: center;
  gap: 8px;
  min-height: 44px;
  padding: 4px 0;
  border: 0;
  background: transparent;
  color: var(--text-secondary);
  font: 600 0.875rem var(--font-body);
  text-align: left;
  cursor: pointer;
}
.connection-status:hover { text-decoration: underline; }
.connection-status:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 4px; }
.connection-status[data-tone="loading"] { color: var(--primary); }
.connection-status[data-tone="error"], .connection-error { color: var(--error); }
.connection-status[data-tone="warning"], .connection-warning { color: var(--warning); }
.connection-status[data-tone="success"] { color: var(--success); }
.connection-icon { display: inline-block; flex-shrink: 0; }
.connection-status[data-tone="loading"] .connection-icon { animation: connectionSpin 1.2s linear infinite; }
@keyframes connectionSpin { to { transform: rotate(360deg); } }
.loading-state { display: flex; flex-direction: column; gap: 16px; }
.skeleton-card {
  height: 190px;
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-card);
  background: var(--bg-surface-raised);
  position: relative;
  overflow: hidden;
}
.skeleton-card::after {
  content: '';
  display: block;
  height: 14px;
  width: 55%;
  margin: 24px;
  border-radius: 6px;
  background: var(--border-subtle);
  box-shadow: 0 28px 0 var(--border-subtle);
}
.skeleton-short { height: 94px; }
.connection-dialog {
  margin: auto;
  width: min(580px, calc(100% - 24px));
  max-height: 90dvh;
  padding: 24px;
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-sheet);
  background: var(--bg-surface-raised);
  color: var(--text-primary);
  box-shadow: var(--shadow-overlay);
}
.connection-dialog::backdrop { background: var(--scrim); }
.connection-details { display: flex; flex-direction: column; gap: 16px; overflow-wrap: anywhere; }
.connection-summary { font-weight: 600; }
.connection-facts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 16px; font-size: 0.95rem; }
.connection-facts dt { color: var(--text-secondary); }
.connection-facts dd { margin: 0; }
.connection-actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 20px; }
.connection-actions .btn { flex: 1 1 180px; }
.connection-feedback { margin-top: 12px; }
.connection-error, .connection-warning { font-size: 0.95rem; margin-top: 8px; }

/* Main Container */
.container {
  max-width: 600px;
  margin: 0 auto;
  padding: 16px;
}

/* Persistent Active Session Banner */
.active-session-banner {
  background: var(--bg-surface-raised);
  border-bottom: 2px solid var(--primary);
  padding: 12px 16px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
}

.active-session-banner-info {
  display: flex;
  flex-direction: column;
}

.active-session-banner-title {
  font-family: var(--font-display);
  font-weight: 600;
  font-size: 0.95rem;
  color: var(--text-primary);
}

.active-session-banner-meta {
  font-size: 0.82rem;
  color: var(--text-secondary);
}

/* Bottom Navigation */
.bottom-nav {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  height: 64px;
  background: var(--bg-surface);
  border-top: 1px solid var(--border-subtle);
  display: flex;
  justify-content: space-around;
  align-items: center;
  z-index: 100;
  padding-bottom: env(safe-area-inset-bottom, 0);
}

.nav-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4px;
  background: none;
  border: none;
  color: var(--text-secondary);
  font-family: var(--font-body);
  font-size: 0.8rem;
  font-weight: 400;
  cursor: pointer;
  padding: 6px 12px;
  min-width: 64px;
  min-height: 48px;
  transition: color 120ms ease;
}

.nav-item:focus-visible {
  outline: 3px solid var(--focus);
  outline-offset: 2px;
  border-radius: var(--radius-btn);
}

.nav-item.active {
  color: var(--primary);
  font-weight: 600;
}

.nav-icon {
  font-size: 1.25rem;
  line-height: 1;
}

/* Typography Hierarchy */
.page-title {
  font-family: var(--font-display);
  font-size: 2rem;
  line-height: 2.5rem;
  font-weight: 700;
  color: var(--text-primary);
  margin-bottom: 8px;
}

.exercise-title {
  font-family: var(--font-display);
  font-size: 1.5rem;
  line-height: 2rem;
  font-weight: 700;
  color: var(--text-primary);
}

.section-title {
  font-family: var(--font-display);
  font-size: 1.25rem;
  line-height: 1.75rem;
  font-weight: 600;
  color: var(--text-primary);
  margin-bottom: 8px;
}

.body-text {
  font-size: 1rem;
  line-height: 1.5rem;
  color: var(--text-primary);
}

.metadata-text {
  font-size: 0.875rem;
  line-height: 1.25rem;
  color: var(--text-secondary);
}

/* Cards */
.card {
  background: var(--bg-surface);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-card);
  padding: 20px;
  margin-bottom: 16px;
}

.card-raised {
  background: var(--bg-surface-raised);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-card);
  padding: 20px;
  margin-bottom: 16px;
}

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  font-family: var(--font-body);
  font-size: 1rem;
  font-weight: 600;
  line-height: 1.5;
  border-radius: var(--radius-btn);
  padding: 10px 20px;
  min-height: 48px;
  cursor: pointer;
  text-decoration: none;
  border: 1px solid transparent;
  transform: scale(1);
  box-shadow: 0 1px 2px rgba(18, 20, 23, 0.04);
  transition: transform 160ms ease-out, background-color 120ms ease, color 120ms ease, border-color 120ms ease, box-shadow 160ms ease-out;
  user-select: none;
}

.btn:active:not(:disabled) {
  transform: scale(0.98);
  box-shadow: none;
  transition: transform 70ms ease-out;
}

.btn:focus-visible {
  outline: 3px solid var(--focus);
  outline-offset: 3px;
}

.btn-primary {
  background-color: var(--primary);
  color: var(--on-primary);
  border-color: var(--primary);
}

.btn-primary:hover:not(:disabled) {
  background-color: var(--primary-hover);
  border-color: var(--primary-hover);
}

.btn-primary:active:not(:disabled) {
  background-color: var(--primary-pressed);
  border-color: var(--primary-pressed);
}

.btn-training-primary {
  min-height: 56px;
  font-size: 1.125rem;
  width: 100%;
}

.btn-secondary {
  background-color: var(--bg-surface);
  color: var(--text-primary);
  border: 1px solid var(--border-control);
}

.btn-secondary:hover:not(:disabled) {
  background-color: var(--bg-surface-raised);
}

.btn-secondary:active:not(:disabled) {
  background-color: var(--bg-surface-raised);
  border: 2px solid var(--border-control);
}

.btn-quiet {
  background-color: transparent;
  color: var(--text-primary);
  border: 1px solid transparent;
}

.btn-quiet:hover:not(:disabled) {
  background-color: var(--bg-surface-raised);
}

.btn-destructive {
  background-color: var(--bg-surface);
  color: var(--error);
  border: 1px solid var(--error);
}

.btn-destructive:hover:not(:disabled) {
  background-color: var(--bg-surface-raised);
}

.btn-icon {
  width: 48px;
  height: 48px;
  min-height: 48px;
  padding: 0;
  border-radius: var(--radius-btn);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: var(--bg-surface-raised);
  border: 1px solid var(--border-subtle);
  color: var(--text-primary);
  font-size: 1.25rem;
}

.btn-icon:hover:not(:disabled) {
  border-color: var(--border-control);
}

.btn:disabled {
  background-color: var(--bg-surface-raised) !important;
  color: var(--text-secondary) !important;
  border-color: var(--border-subtle) !important;
  cursor: not-allowed;
  opacity: 0.7;
}

.btn-sm {
  min-height: 36px;
  padding: 6px 12px;
  font-size: 0.875rem;
}

/* Form Inputs */
.form-group {
  margin-bottom: 16px;
}

.form-label {
  display: block;
  font-size: 0.95rem;
  font-weight: 600;
  color: var(--text-primary);
  margin-bottom: 6px;
}

.form-input {
  width: 100%;
  min-height: 56px;
  padding: 12px 16px;
  font-family: var(--font-body);
  font-size: 1rem;
  color: var(--text-primary);
  background-color: var(--bg-surface);
  border: 1px solid var(--border-control);
  border-radius: var(--radius-btn);
  transition: border-color 120ms ease;
}

.form-input:focus {
  outline: 3px solid var(--focus);
  outline-offset: 2px;
  border-color: var(--focus);
}

.form-input::placeholder {
  color: var(--text-secondary);
}

/* Status Chips */
.chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 12px;
  border-radius: var(--radius-pill);
  font-size: 0.85rem;
  font-weight: 600;
  background: var(--bg-surface-raised);
  color: var(--text-primary);
  border: 1px solid var(--border-subtle);
}

.chip-success {
  color: var(--success);
  border-color: var(--success);
}

.chip-warning {
  color: var(--warning);
  border-color: var(--warning);
}

.chip-primary {
  background-color: var(--primary);
  color: var(--on-primary);
  border-color: var(--primary);
}

/* Segmented Choice */
.segmented-control {
  display: flex;
  background: var(--bg-surface-raised);
  border-radius: var(--radius-btn);
  padding: 4px;
  gap: 4px;
  border: 1px solid var(--border-subtle);
}

.segmented-option {
  flex: 1;
  text-align: center;
  padding: 10px 12px;
  border-radius: 8px;
  font-size: 0.95rem;
  font-weight: 600;
  cursor: pointer;
  background: transparent;
  color: var(--text-secondary);
  border: none;
  transition: background-color 120ms, color 120ms;
}

.segmented-option.active {
  background: var(--bg-surface-selected);
  color: var(--primary);
  border: 2px solid var(--primary);
}

/* Active Session: Focused Current-Set Panel */
.active-set-panel {
  background: var(--bg-surface);
  border: 2px solid var(--primary);
  border-radius: var(--radius-card);
  padding: 20px;
  margin-bottom: 20px;
  box-shadow: 0 4px 16px rgba(0,0,0,0.06);
}

.set-panel-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 12px;
}

.set-panel-title {
  font-family: var(--font-display);
  font-size: 1.1rem;
  font-weight: 700;
  color: var(--primary);
  letter-spacing: 0.5px;
}

.numeric-entry-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
  margin-bottom: 20px;
}

.numeric-entry-box {
  background: var(--bg-surface-raised);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-btn);
  padding: 12px;
  display: flex;
  flex-direction: column;
  align-items: center;
}

.numeric-entry-label {
  font-size: 0.85rem;
  color: var(--text-secondary);
  margin-bottom: 4px;
  font-weight: 600;
}

.numeric-value-container {
  display: flex;
  align-items: baseline;
  gap: 4px;
}

.numeric-value-input {
  font-family: var(--font-display);
  font-size: 2.5rem;
  line-height: 3rem;
  font-weight: 600;
  color: var(--text-primary);
  background: transparent;
  border: none;
  width: 90px;
  text-align: center;
  font-variant-numeric: tabular-nums;
}

.numeric-value-input:focus {
  outline: 2px solid var(--focus);
  border-radius: 6px;
}

.numeric-unit {
  font-size: 1rem;
  color: var(--text-secondary);
  font-weight: 600;
}

.stepper-row {
  display: flex;
  gap: 8px;
  margin-top: 8px;
  width: 100%;
}

.stepper-btn {
  flex: 1;
  min-height: 48px;
  background: var(--bg-surface);
  border: 1px solid var(--border-control);
  border-radius: var(--radius-btn);
  font-family: var(--font-display);
  font-size: 1rem;
  font-weight: 600;
  color: var(--text-primary);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transform: scale(1);
  transition: transform 160ms ease-out, background-color 120ms ease;
  user-select: none;
}

.stepper-btn:active {
  background: var(--bg-surface-raised);
  transform: scale(0.95);
  transition: transform 70ms ease-out;
}

/* Compact Set Outline */
.set-outline-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
  margin-bottom: 20px;
}

.set-outline-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 16px;
  border-radius: var(--radius-btn);
  background: var(--bg-surface);
  border: 1px solid var(--border-subtle);
  font-size: 0.95rem;
}

.set-outline-row.current {
  border-color: var(--primary);
  background: var(--bg-surface-raised);
  font-weight: 600;
}

.set-outline-row.recorded {
  opacity: 0.9;
}

.set-outline-left {
  display: flex;
  align-items: center;
  gap: 12px;
}

/* Benchmark ("Last Time") Card */
.benchmark-card {
  background: var(--bg-surface-raised);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-btn);
  padding: 12px 16px;
  margin-bottom: 16px;
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.benchmark-card-header {
  font-size: 0.85rem;
  font-weight: 600;
  color: var(--text-secondary);
  display: flex;
  justify-content: space-between;
}

.benchmark-card-val {
  font-family: var(--font-display);
  font-size: 1.1rem;
  font-weight: 600;
  color: var(--text-primary);
  font-variant-numeric: tabular-nums;
}

/* Rest Timer Panel */
.rest-panel {
  background: var(--bg-surface-raised);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-card);
  padding: 16px 20px;
  margin-bottom: 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
}

.rest-time-display {
  font-family: var(--font-display);
  font-size: 2.5rem;
  line-height: 1;
  font-weight: 600;
  color: var(--text-primary);
  font-variant-numeric: tabular-nums;
}

.rest-controls {
  display: flex;
  gap: 8px;
}

/* Modal / Sheet Overlays */
.modal-overlay,
.modal-backdrop {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: var(--scrim);
  display: flex;
  justify-content: center;
  align-items: flex-end;
  z-index: 200;
  animation: fadeIn 150ms ease;
}

@media (min-width: 640px) {
  .modal-overlay,
  .modal-backdrop {
    align-items: center;
  }
}

.modal-sheet,
.modal-card {
  background: var(--bg-surface-raised);
  border-radius: var(--radius-sheet) var(--radius-sheet) 0 0;
  width: 100%;
  max-width: 580px;
  max-height: 90vh;
  overflow-y: auto;
  padding: 24px;
  box-shadow: var(--shadow-overlay);
  display: flex;
  flex-direction: column;
}

@media (min-width: 640px) {
  .modal-sheet,
  .modal-card {
    border-radius: var(--radius-sheet);
  }
}

.modal-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
}

.modal-header h3,
.modal-title {
  font-family: var(--font-display);
  font-size: 1.35rem;
  font-weight: 700;
  color: var(--text-primary);
  margin: 0;
}

@keyframes fadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}

@keyframes sheetSlideUp {
  from {
    opacity: 0;
    transform: translateY(16px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.modal-sheet,
.modal-card {
  animation: sheetSlideUp 220ms ease-out;
}

/* Settings Modal & Status Pill */
.settings-section h4 {
  font-size: 0.95rem;
  font-weight: 600;
  color: var(--text-primary);
  margin-bottom: 8px;
}

.theme-selector-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
  margin-top: 8px;
}

.status-pill {
  display: inline-flex;
  align-items: center;
  padding: 4px 10px;
  border-radius: 999px;
  font-size: 0.75rem;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.04em;
}

.status-pill.status-idle {
  background: var(--surface-container-high);
  color: var(--on-surface-variant);
}

.status-pill.status-loading {
  background: rgba(234, 179, 8, 0.15);
  color: #eab308;
}

.status-pill.status-success {
  background: rgba(34, 197, 94, 0.15);
  color: #22c55e;
}

.status-pill.status-error {
  background: rgba(239, 68, 68, 0.15);
  color: #ef4444;
}

@keyframes recordHighlight {
  0% {
    box-shadow: 0 0 0 2px var(--success);
    background-color: var(--bg-surface-selected);
  }
  100% {
    box-shadow: 0 0 0 0 transparent;
    background-color: var(--bg-surface);
  }
}

.set-outline-row.just-recorded {
  animation: recordHighlight 450ms ease-out;
}

@keyframes valueHighlight {
  0% {
    background-color: var(--bg-surface-selected);
  }
  100% {
    background-color: var(--bg-surface-raised);
  }
}

.numeric-entry-box.value-changed {
  animation: valueHighlight 400ms ease-out;
}

/* Reduced Motion Override */
@media (prefers-reduced-motion: reduce) {
  *, ::before, ::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
    transform: none !important;
  }
}

        modal.querySelectorAll(".btn-pos-down").forEach((b) => {

          ${this.app.exercises.map((e) => `
            <div class="card-raised" style="padding: 12px 16px; margin-bottom: 0; cursor: pointer; display: flex; justify-content: space-between; align-items: center;" data-ex-id="${e.id}">
              <div>
                <div style="font-weight: 600;">${e.name}</div>
                <div class="metadata-text">${e.equipment ? e.equipment + " \xB7 " : ""}${e.targetMuscle || "Muscle"}</div>

        });
      });
    }
  };

  // src/client/views/progress.js
  var ProgressView = class {
    constructor(app2) {
      this.app = app2;
      this.activeTab = "sessions";
      this.selectedExerciseId = null;
      this.exerciseHistory = [];
    }
    render() {
      const history = this.app.history || [];
      const exercises = this.app.exercises || [];
      return `
      <div style="display: flex; flex-direction: column; gap: 20px;">
        <div>
          <div class="metadata-text" style="font-weight: 600; text-transform: uppercase;">History & Insights</div>
          <h1 class="page-title" style="margin-top: 2px;">Progress</h1>
        </div>

        <!-- Segmented Tab: Sessions \xB7 Exercises -->
        <div class="segmented-control" id="progress-segmented">
          <button class="segmented-option ${this.activeTab === "sessions" ? "active" : ""}" data-tab-val="sessions">
            Sessions
          </button>
          <button class="segmented-option ${this.activeTab === "exercises" ? "active" : ""}" data-tab-val="exercises">
            Exercises
          </button>
        </div>

        <!-- Content Area -->
        <div id="progress-content">
          ${this.activeTab === "sessions" ? this.renderSessionsTab(history) : this.renderExercisesTab(exercises)}

    renderSessionsTab(history) {
      if (history.length === 0) {
        return `
        <div class="card" style="text-align: center; padding: 40px 20px;">
          <h2 class="section-title">No Recorded Sessions Yet</h2>
          <p class="metadata-text">Your completed workout sessions will appear here with full set logs and notes.</p>
        </div>
      `;
      }
      return `
      <div style="display: flex; flex-direction: column; gap: 12px;">
        ${history.map((s) => {
        const dateStr = new Date(s.completedAt || s.startedAt).toLocaleDateString("en-US", {
          weekday: "short",
          month: "short",
          day: "numeric",
          year: "numeric"
        });
        const setsCount = s.progress?.totalWorkingSets || 0;
        const note = s.progress?.sessionNote;
        return `
            <div class="card" style="margin-bottom: 0; padding: 16px 20px;">
              <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 6px;">
                <div>

                ${setsCount} working sets logged
              </div>
              <p class="metadata-text">
                ${s.publication === "pending" ? this.app.offline.status.error ? `<span style="color: var(--accent-danger); font-size: 0.85rem;">Saved on device \xB7 upload failed (${this.app.offline.status.error})</span>` : "Saved on this device \xB7 waiting to upload" : "Saved to Sheets"}
              </p>
              ${s.publication === "pending" ? `
                <div style="margin-top: 8px;">
                  <button class="btn btn-secondary btn-sm btn-retry-session-upload" data-session-id="${s.id}" ${this.app.offline.status.uploading ? "disabled" : ""}>
                    ${this.app.offline.status.uploading ? "Uploading\u2026" : "Upload now"}
                  </button>
                </div>
              ` : ""}

              ${note ? `
                <div style="margin-top: 10px; padding: 8px 12px; background: var(--bg-surface-raised); border-radius: 8px; font-size: 0.9rem; font-style: italic;">
                  "${note}"
                </div>
              ` : ""}
            </div>
          `;
      }).join("")}
      </div>
    `;
    }
    renderExercisesTab(exercises) {
      const unit = localStorage.getItem("my_gym_units") || "kg";
      return `
      <div style="display: flex; flex-direction: column; gap: 16px;">
        <div>
          <label class="form-label">Select Movement</label>
          <select class="form-input" id="select-history-exercise" style="cursor: pointer;">
            <option value="">-- Choose an exercise --</option>
            ${exercises.map((e) => `
              <option value="${e.id}" ${this.selectedExerciseId === e.id ? "selected" : ""}>
                ${e.name} (${e.equipment || "Bodyweight"})
              </option>
            `).join("")}
          </select>
        </div>

        <div id="exercise-history-results">
          ${this.selectedExerciseId ? this.renderExerciseHistoryList(unit) : `
            <div class="metadata-text" style="text-align: center; padding: 32px 16px;">
              Select an exercise to review your performance and notes over time.
            </div>
          `}
        </div>
      </div>
    `;
    }
    renderExerciseHistoryList(unit) {
      if (this.exerciseHistory.length === 0) {
        return `
        <div class="card-raised" style="text-align: center; padding: 24px;">
          <p class="metadata-text">No recorded history found for this exercise yet.</p>
        </div>
      `;
      }
      return `
      <div style="display: flex; flex-direction: column; gap: 12px;">
        ${this.exerciseHistory.map((entry) => {
        const dateStr = new Date(entry.sessionDate).toLocaleDateString("en-US", {
          month: "short",
          day: "numeric",
          year: "numeric"
        });
        const setsDesc = entry.sets.map((s, idx) => `Set ${idx + 1}: ${s.result?.weight || 0} ${unit} \xD7 ${s.result?.reps || 0}`).join(" \xB7 ");
        return `
            <div class="card" style="margin-bottom: 0; padding: 14px 18px;">
              <div style="display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 6px;">
                <span style="font-weight: 700; color: var(--text-primary);">${entry.workoutName}</span>
                <span class="metadata-text">${dateStr}</span>
              </div>
              <div style="font-family: var(--font-display); font-size: 1rem; color: var(--text-primary); margin-bottom: 4px;">
                ${setsDesc}
              </div>
              ${entry.exerciseNote ? `
                <div class="metadata-text" style="font-style: italic;">Note: "${entry.exerciseNote}"</div>
              ` : ""}
            </div>
          `;
      }).join("")}
      </div>
    `;
    }
    attachEvents(container) {
      container.querySelectorAll("#progress-segmented .segmented-option").forEach((btn) => {
        btn.addEventListener("click", () => {
          this.activeTab = btn.dataset.tabVal;
          container.querySelectorAll("#progress-segmented .segmented-option").forEach((b) => b.classList.remove("active"));
          btn.classList.add("active");
          const contentEl = container.querySelector("#progress-content");
          if (contentEl) {
            contentEl.innerHTML = this.activeTab === "sessions" ? this.renderSessionsTab(this.app.history || []) : this.renderExercisesTab(this.app.exercises || []);
            this.attachContentEvents(container);
          }
        });
      });
      this.attachContentEvents(container);
    }
    attachContentEvents(container) {
      const select = container.querySelector("#select-history-exercise");
      select?.addEventListener("change", async (e) => {
        const exId = e.target.value;
        this.selectedExerciseId = exId;
        if (!exId) {
          this.exerciseHistory = [];
          this.updateExerciseResults(container);
          return;
        }
        try {
          this.exerciseHistory = await this.app.api("getExerciseHistory", { exerciseId: exId });
          this.updateExerciseResults(container);
        } catch (err) {
          alert("Failed to load exercise history: " + err.message);
        }
      });
      container.querySelectorAll(".btn-retry-session-upload").forEach((btn) => {
        btn.addEventListener("click", async () => {
          btn.disabled = true;
          btn.textContent = "Uploading\u2026";
          try {
            await this.app.offline.upload();
            await this.app.refresh();
          } catch (err) {
            alert("Upload failed: " + err.message);
          } finally {
            btn.disabled = false;
          }
        });
      });
    }
    updateExerciseResults(container) {
      const resultsEl = container.querySelector("#exercise-history-results");
      const unit = localStorage.getItem("my_gym_units") || "kg";
      if (resultsEl) {
        resultsEl.innerHTML = this.selectedExerciseId ? this.renderExerciseHistoryList(unit) : '<div class="metadata-text" style="text-align: center; padding: 32px 16px;">Select an exercise to review history.</div>';
      }
    }
  };

  // src/client/views/session.js
  var ActiveSessionView = class {
    constructor(app2) {
      this.app = app2;
      this.currentPositionIndex = 0;
      this.weightInputVal = null;
      this.repsInputVal = null;
      this.isWarmup = false;
      this.lastLoggedSetId = null;
    }
    getCurrentPosition() {
      const session = this.app.activeSession;
      if (!session || !session.plan?.positions || session.plan.positions.length === 0) return null;
      return session.plan.positions[this.currentPositionIndex] || session.plan.positions[0] || null;
    }
    getCurrentExercise() {
      const pos = this.getCurrentPosition();
      if (!pos) return null;
      const session = this.app.activeSession;
      const chosenExId = session.progress?.selectedAlternatives?.[pos.id] || session.chosenExercises?.[pos.id] || pos.exerciseId;
      return pos.allowedExercises?.find((e) => e.id === chosenExId) || this.app.exercises.find((e) => e.id === chosenExId) || { id: chosenExId, name: "Exercise", recordingKind: "reps_weight" };
    }

      const session = this.app.activeSession;
      if (!session) {
        return `
        <div class="card" style="text-align: center; padding: 40px 20px;">
          <h2 class="section-title">No Active Session</h2>
          <p class="metadata-text" style="margin-bottom: 20px;">You don't have a workout session currently in progress.</p>
          <button class="btn btn-primary" id="btn-session-go-today">Go to Today</button>

          </div>
        </div>
      `;
      }
      const unit = localStorage.getItem("my_gym_units") || "kg";
      const allPosLogs = (session.setLogs || []).filter((l) => l.positionId === pos.id && !l.voidedAt);
      const warmupLogs = allPosLogs.filter((l) => l.isWarmup);
      const workingLogs = allPosLogs.filter((l) => !l.isWarmup);
      const currentSetNum = workingLogs.length + 1;
      const plannedSetsCount = pos.plannedSets?.length || 3;
      const currentPlannedSet = pos.plannedSets?.[workingLogs.length] || pos.plannedSets?.[pos.plannedSets.length - 1];
      const benchmark = this.app.benchmarks?.[exercise.id] || null;
      const benchSet = benchmark?.sets?.[workingLogs.length] || benchmark?.sets?.[0];
      if (this.weightInputVal === null) {
        if (benchSet?.result?.weight !== void 0) {
          this.weightInputVal = benchSet.result.weight;
        } else if (workingLogs.length > 0) {
          this.weightInputVal = workingLogs[workingLogs.length - 1].result?.weight || 20;
        } else {
          this.weightInputVal = 20;
        }
      }
      if (this.repsInputVal === null) {
        if (benchSet?.result?.reps !== void 0) {
          this.repsInputVal = benchSet.result.reps;
        } else if (currentPlannedSet?.repsTarget) {
          const parsed = parseInt(currentPlannedSet.repsTarget, 10);
          this.repsInputVal = isNaN(parsed) ? 8 : parsed;
        } else {
          this.repsInputVal = 8;
        }
      }
      return `
      <div style="display: flex; flex-direction: column; gap: 16px;">
        <!-- Top Orientation Bar -->
        <div style="display: flex; justify-content: space-between; align-items: flex-start;">
          <div>
            <div class="metadata-text" style="font-weight: 600; text-transform: uppercase;">
              ${session.workoutName} \xB7 Exercise ${this.currentPositionIndex + 1} of ${totalPositions}
            </div>
            <h1 class="exercise-title" style="margin-top: 2px;">${exercise.name}</h1>
            <div class="metadata-text">
              ${exercise.equipment ? exercise.equipment + " \xB7 " : ""}${exercise.loggingConvention || "Standard resistance"}
            </div>
          </div>
          <button class="btn btn-secondary btn-sm" id="btn-session-outline" style="white-space: nowrap;">
            \u{1F4CB} Outline
          </button>
        </div>

        <!-- Target prescription & notes -->
        <div class="card-raised" style="padding: 12px 16px; margin-bottom: 0;">
          <div style="font-size: 0.95rem; font-weight: 600; color: var(--text-primary);">
            Today: ${plannedSetsCount} sets ${currentPlannedSet?.repsTarget ? `\xB7 ${currentPlannedSet.repsTarget} reps` : ""}
            ${currentPlannedSet?.rpeTarget ? `\xB7 Target RPE ${currentPlannedSet.rpeTarget}` : ""}
          </div>
          ${pos.notes ? `<div class="metadata-text" style="margin-top: 4px;">Note: ${pos.notes}</div>` : ""}
        </div>

        <!-- Benchmark / Last Time Comparison -->
        ${benchmark ? `
          <div class="benchmark-card">
            <div class="benchmark-card-header">
              <span>LAST TIME \xB7 ${new Date(benchmark.sessionDate).toLocaleDateString("en-US", { month: "short", day: "numeric" })}</span>
              <span>Set ${workingLogs.length + 1}</span>
            </div>
            <div class="benchmark-card-val">
              ${benchSet?.result?.weight ? `${benchSet.result.weight} ${unit} \xD7 ` : ""}${benchSet?.result?.reps || 0} reps
            </div>
            ${benchmark.exerciseNote ? `<div class="metadata-text" style="font-style: italic;">"${benchmark.exerciseNote}"</div>` : ""}
          </div>
        ` : `
          <div class="metadata-text" style="padding: 4px 8px;">
            No previous results for this exercise yet.
          </div>
        `}

        <!-- Rest Panel (if running) -->
        ${this.renderRestPanel()}

        <!-- Signature Focused Current-Set Panel -->
        <div class="active-set-panel">
          <div class="set-panel-header">
            <span class="set-panel-title">

        const isWarmup = this.isWarmup;

        const setIndex = isWarmup ? allPosLogs.filter((l) => l.isWarmup).length + 1 : allPosLogs.filter((l) => !l.isWarmup).length + 1;

          </div>
        </div>

        <div style="display: flex; flex-direction: column; gap: 8px;">
          <button class="btn btn-primary btn-training-primary" id="btn-confirm-finish">
            Finish workout
          </button>
          <p class="metadata-text">Saved on this device immediately. The completed workout uploads when connected.</p>
          <button class="btn btn-secondary" id="btn-keep-training">
            Keep Training
          </button>
        </div>
      </div>
    `;
      document.querySelector("#modal-container").appendChild(modal);
      const close = () => modal.remove();
      modal.querySelector("#btn-close-finish")?.addEventListener("click", close);
      modal.querySelector("#btn-keep-training")?.addEventListener("click", close);
      modal.addEventListener("click", (e) => {
        if (e.target === modal) close();
      });
      modal.querySelector("#btn-confirm-finish")?.addEventListener("click", () => this.runAction("finish", "#btn-confirm-finish", "Finishing\u2026", async () => {
        const note = modal.querySelector("#input-session-note")?.value?.trim();
        try {
          await this.api("finishSession", {
            sessionId: session.id,
            sessionNote: note || void 0
          });
          this.endRestTimer();
          this.activeSession = null;
          close();
          await this.refresh();
          this.setActiveTab("progress");
          this.uploadCompleted();
        } catch (err) {
          alert("Failed to finish session: " + err.message);
        }
      }));
    }
    openSettingsModal() {
      const modalContainer = document.querySelector("#modal-container");
      if (!modalContainer) return;
      modalContainer.innerHTML = this.views.settings.render();
      this.views.settings.attachEvents(modalContainer);
    }
  };
  var app = new GymApp();
  window.app = app;
  app.init();
})();

</script>
</body>
</html>
